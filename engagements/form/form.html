<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form</title>
        <link rel="stylesheet" href="form.css">
    </head>
    <body>
        <header>
            <h1>Kevin Web Design on Form</h1>
        </header>
        <nav>
            <a href="#">Home</a>
            <a href="#">Page1</a>
            <a href="#">Page2</a>
        </nav>
        <main>
            <form action="formprocessing.html" method="post">
                <fieldset>
                    <legend>Account</legend>
                    <div class="form-row">
                        <label for="personname">Full Name</label>
                        <input id="personname" type="text" name="fullname" placeholder="Full Name">
                    </div>
                    <div class="form-row">
                        <label for="email">Email</label>
                        <input id="email" type="email" name="email" placeholder="Email">
                    </div>
                    <div class="form-row">
                        <label for="bdate">Birtherday</label>
                        <input id="bdate" type="date" name="bdate" placeholder="Birthday">
                    </div>
                    <div class="form-row">
                        <label for="password">Password</label>
                        <input id="password" type="password" name="pass" placeholder="Password">
                    </div>
                    <div class="form-row">
                        <label for="state">State</label>
                        <select name="state" id="state">
                            <option value="blank">------</option>
                            <option value="HI">Hawaii</option>
                            <option value="UT">Utah</option>
                        </select>
                    </div>
                    <div class="check-row">
                        <div class="space">Gender</div>
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">Male</label>

                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label>
                    </div>
                    <div class="check-row">
                        <div class="space"></div>
                        <input type="checkbox" id="remember" name="skill" value="remember">
                        <label for="remember">Remember Me?</label>
                    </div>
                    <div class="form-row">
                        <label for="reason">Comment?</label>
                        <textarea id="reason" name="reason" rows="4" cols="40" placeholder="Tell us about yourself..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="space"></div>
                        <input type="submit" value="Sign Up">
                    </div>
            </form>
            </fieldset>
        </main>
        <footer>
            &copy;2026 Kevin Yang
        </footer>
    </body>
</html>
